<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
</head>
<body>
    <div style="height: 40px; background-color: green;"></div>

    <div style="height: 40px; background-color: blueviolet; position: sticky; top: 0;">
        <p style="float: left;">Navbar</p>
        <p style="float: right;">Js2026</p>
    </div>
    <h1>Position</h1>
    <div style="position: relative; height: 360px; z-index: -1">
        <img style="width: 100%; height: 360px;" src="./images/wallpaper.png" alt="wallpaper">
        <h2 style="color: red; position: absolute; top: 45%; left: 40%;">Welcome</h2>
        <h2 style="color: red; position: absolute; bottom: 20px; right: 20px">Welcome</h2>
    </div>
    <h3 style="color: red; position: fixed; top: 10px; right: 20px">Author: Araiva</h3>
</body>
</html>
