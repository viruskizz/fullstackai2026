<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display</title>
</head>
<body>
    <h1>Display</h1>
    <h2 style="display: inline;">Heading2</h2>
    <a href="" style="display: inline-block; height: 40px;"">link</a>
    <img src="./images/ff1-cover.webp" style="display: block;"  width="120px">
    <img src="./images/ff2-cover.webp" width="160px">
    <img src="./images/ff3-cover.webp" style="display: none;" width="160px">
    <img src="./images/ff4-cover.webp" style="opacity: 30%;" width="160px">
    <img src="./images/ff5-cover.webp" style="visibility: hidden;" width="160px">
    <div style="display: none; height: 200px; background-color: aqua;">
        <h2>Detail</h2>
    </div>
    <img src="./images/ff6-cover.webp" width="160px">
</body>
</html>
