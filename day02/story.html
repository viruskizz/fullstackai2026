<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Quiz</title>
  <style>
    label {
        color: red;
    }
  </style>
</head>
<body>
  <form>
    <!-- Personal Information Section -->
    <!-- <label for="fname">ชื่อจริง</label> -->
    Firstname
    <input type="text" id="fname" name="fname"><br><br>

    <label for="lname">นามสกุล</label>
    <input type="text" id="lname" name="lname"><br><br>

    <label for="age">อายุ</label>
    <input type="number" id="age" name="age"><br><br>

    <label for="email">อีเมล</label>
    <input type="email" id="email" name="email"><br><br>

    <label for="phone">เบอร์โทร</label>
    <input type="tel" id="phone" name="phone"><br><br>

    <label for="country">ประเทศ</label>
    <select id="country" name="country">
      <option value="" disabled selected>โปรดเลือกประเทศ</option>
      <option value="thailand">ประเทศไทย</option>
      <option value="other">อื่นๆ</option>
    </select><br>

    <label for="bio">Bio</label>
    <br>
    <textarea name="bio" id="bio" cols="50" rows="5"></textarea>

    <hr>

    <!-- Question 1: Checkbox -->
    <h3>1. element อะไรบ้างโครงสร้างหลักของ HTML ที่จำเป็นต้องมี ?</h3>
    
    <input type="checkbox" id="q1_body" name="q1" value="body">
    <label for="q1_body">&lt;body&gt;</label><br>

    <input type="checkbox" id="q1_head" name="q1" value="head">
    <label for="q1_head">&lt;head&gt;</label><br>

    <input type="checkbox" id="q1_doctype" name="q1" value="doctype">
    <label for="q1_doctype">&lt;!DOCTYPE&gt;</label><br>

    <input type="checkbox" id="q1_p" name="q1" value="p">
    <label for="q1_p">&lt;p&gt;</label><br><br>

    <!-- Question 2: Radio Button -->
    <h3>2. จะใส่ link ไปยัง website อื่น ต้องใช้ tag อะไร ?</h3>

    <input type="radio" id="q2_link" name="q2" value="link">
    <label for="q2_link">&lt;link&gt;</label><br>

    <input type="radio" id="q2_l" name="q2" value="l">
    <label for="q2_l">&lt;l&gt;</label><br>

    <input type="radio" id="q2_a" name="q2" value="a">
    <label for="q2_a">&lt;a&gt;</label><br>

    <input type="radio" id="q2_url" name="q2" value="url">
    <label for="q2_url">&lt;url&gt;</label><br>
  </form>
</body>
</html>
