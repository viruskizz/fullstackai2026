<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        thead {
            background-color: aqua;
        }
        tbody {
            background-color: azure;
        }
        tfoot {
            background-color: navy;
            color: white;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
            <th>Name</th>
            <th>Amount</th>
            <th>Price</th>
        </tr>
        </thead>
        <tbody>
            <tr>
                <td>PlayStation 5</td>
                <td>1</td>
                <td>300$</td>
            </tr>
            <tr>
                <td>Nintendo Switch</td>
                <td>1</td>
                <td>200$</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">sum</td>
                <td>500$</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
